[project]
name = "jev-experiment"
version = "0.1.0"
description = "Reproducible ownership-classification benchmark for Jev and Claude"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=6,<7",
    "httpx>=0.28",
    "langgraph>=1.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "streamlit>=1.64,<2",
    "system-one-adapter[openai]>=0.2.1",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]

[project.scripts]
jev-experiment = "jev_experiment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_experiment"]
